# Agente de citas por WhatsApp: n8n + Postgres + Caddy (HTTPS automático).
# Los valores entre ${...} salen del archivo .env que crea instalar.sh.
name: agente-citas

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
      CORREO_SSL: ${CORREO_SSL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      TZ: ${ZONA_HORARIA}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    # Solo accesible desde el propio servidor; Caddy lo publica con HTTPS.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: ${DOMINIO}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${DOMINIO}/
      N8N_WEBHOOK_URL: https://${DOMINIO}/
      N8N_PROXY_HOPS: "1"
      NODE_ENV: production
      GENERIC_TIMEZONE: ${ZONA_HORARIA}
      TZ: ${ZONA_HORARIA}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Guarda 14 días de historial de ejecuciones para no llenar el disco.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  n8n_data:
